format:
  html:
    theme: cosmo
    toc: true
    toc-location: left
    code-copy: true
    code-overflow: wrap
    css: docs/styles.css

quartodoc:
  package: beam
  dir: docs/reference
  title: API reference
  sidebar: docs/reference/_sidebar.yml
  sections:
    - title: Pipeline
      desc: The top-level procedural API.
      contents:
        - rank
        - load_scores
        - report
        - RunResult
        - Scores
    - title: MCDA
      desc: Normalization, weights, aggregation, ranking.
      package: beam.mcda
      contents:
        - run
        - run_from_registry
        - normalize
        - weighted_sum
        - topsis
        - vikor
        - promethee_ii
        - comet
        - rank
        - equal_weights
        - entropy_weights
        - standard_deviation_weights
        - critic_weights
        - merec_weights
        - ahp_weights
    - title: Sensitivity
      desc: Stability and perturbation primitives.
      package: beam.mcda
      contents:
        - leave_one_metric_out
        - leave_one_dataset_out
        - smaa
        - smallest_weight_perturbation
        - aggregation_agreement
        - critical_difference
        - skillings_mack
        - coverage_aware_critical_difference
    - title: Heterogeneity
      desc: Mixed-effects, Bradley-Terry trees, Plackett-Luce.
      package: beam.heterogeneity
      contents:
        - mixed_effects
        - bradley_terry_tree
        - plackett_luce
        - source_variance_decomposition
        - paired_comparisons
        - rankings_from_matrix
    - title: Cards and registry
      package: beam.cards
      contents:
        - Registry
        - MetricCard
        - polarities_for
        - properties_for
    - title: Datasets
      package: beam.datasets
      contents:
        - load_duo2018
        - load_m4
        - load_openproblems
        - load_integration_benchmarks
        - load_pancreas_contrast
