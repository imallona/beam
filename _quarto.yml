project:
  type: website
  output-dir: _site
  render:
    - "docs/tutorials/*.md"
    - "docs/how-to/*.md"
    - "docs/explanations/*.md"
    - "docs/explanations/*.qmd"
    - "examples/*/*.qmd"
    - "docs/reference/*.qmd"
    - "docs/metric-cards.qmd"
    - "index.qmd"

