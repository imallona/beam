name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

  r-validation:
    name: R-side metric card validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonvalidate
            any::yaml
            any::jsonlite

      - name: Validate cards from R
        run: Rscript tests/validate_cards.R

  heterogeneity:
    name: Heterogeneity diagnostics (Python + R lme4, psychotree)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/heterogeneity.yml

      - name: Install beam into the conda env
        run: pip install -e ".[dev]"

      - name: Run the heterogeneity tests
        run: pytest -q tests/test_heterogeneity_mixed_effects.py tests/test_heterogeneity_bradley_terry.py tests/test_heterogeneity_plackett_luce.py

  vignettes:
    name: Render Quarto vignettes
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # The render job uses the heterogeneity conda environment so R with lme4,
      # psychotree and partykit is on PATH. That way the guarded heterogeneity
      # sections (the mixed-effects fit and the Bradley-Terry tree) render with
      # their figures instead of printing the "R not available" skip message.
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/heterogeneity.yml

      - name: Install beam plus docs extras
        run: pip install -e ".[dev,docs]"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Render Duo vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/duo2018/duo2018.qmd

      - name: Render scenarios vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/scenarios/scenarios.qmd

      - name: Render transportation vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/transportation/transportation.qmd

      - name: Render M4 vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/m4/m4.qmd

      - name: Render OpenProblems vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/openproblems/openproblems.qmd

      - name: Upload rendered Duo vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: duo2018-vignette
          path: examples/duo2018/duo2018.html
          if-no-files-found: error

      - name: Upload rendered scenarios vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-vignette
          path: examples/scenarios/scenarios.html
          if-no-files-found: error

      - name: Upload rendered transportation vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: transportation-vignette
          path: examples/transportation/transportation.html
          if-no-files-found: error

      - name: Upload rendered M4 vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: m4-vignette
          path: examples/m4/m4.html
          if-no-files-found: error

      - name: Upload rendered OpenProblems vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: openproblems-vignette
          path: examples/openproblems/openproblems.html
          if-no-files-found: error
