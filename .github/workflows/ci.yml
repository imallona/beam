name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

  r-validation:
    name: R-side metric card validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonvalidate
            any::yaml
            any::jsonlite

      - name: Validate cards from R
        run: Rscript tests/validate_cards.R

  vignettes:
    name: Render Quarto vignettes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install beam plus docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.57"

      - name: Render Duo vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/duo2018/duo2018.qmd

      - name: Render scenarios vignette
        env:
          MPLBACKEND: Agg
        run: quarto render examples/scenarios/scenarios.qmd

      - name: Upload rendered Duo vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: duo2018-vignette
          path: examples/duo2018/duo2018.html
          if-no-files-found: error

      - name: Upload rendered scenarios vignette as artefact
        uses: actions/upload-artifact@v4
        with:
          name: scenarios-vignette
          path: examples/scenarios/scenarios.html
          if-no-files-found: error
