name: r-ci

on:
  push:
    branches: [main]
    paths:
      - 'r/beam/R/**'
      - 'r/beam/DESCRIPTION'
      - 'r/beam/NAMESPACE'
      - 'r/beam/tests/**'
      - 'r/beam/vignettes/**'
      - 'src/beam/**'
      - '.github/workflows/r-ci.yml'
  pull_request:
    paths:
      - 'r/beam/R/**'
      - 'r/beam/DESCRIPTION'
      - 'r/beam/NAMESPACE'
      - 'r/beam/tests/**'
      - 'r/beam/vignettes/**'
      - 'src/beam/**'
      - '.github/workflows/r-ci.yml'
  workflow_dispatch:

jobs:
  r-cmd-check:
    name: R CMD check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python beam from source checkout
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Point reticulate at the workflow Python
        shell: bash
        run: echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/beam
          # Build and check tools, then the R packages the native heterogeneity
          # diagnostics fit with. Without these the heterogeneity tests skip.
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            any::testthat
            any::knitr
            any::rmarkdown
            any::reticulate
            any::lme4
            any::glmmTMB
            any::psychotree
            any::psychotools
            any::partykit
            any::PlackettLuce
            any::qvcalc
            any::meta
            any::netmeta

      - name: Generate man pages with roxygen2
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise("r/beam")

      - name: Verify reticulate sees the workflow Python
        shell: Rscript {0}
        run: |
          reticulate::use_python(Sys.which("python"), required = TRUE)
          stopifnot(reticulate::py_module_available("beam"))

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r/beam
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          check-dir: '"check"'

      # R CMD check above already builds the vignettes (Python beam and the
      # heterogeneity Suggests are installed, so every chunk evaluates). This
      # step re-renders them to standalone HTML and uploads them so the rendered
      # vignettes are downloadable from the Actions tab, on linux only.
      - name: Render vignettes for browsing
        if: always() && matrix.config.os == 'ubuntu-latest'
        shell: bash
        run: |
          R CMD INSTALL --no-multiarch r/beam
          mkdir -p rendered-vignettes
          Rscript -e 'reticulate::use_python(Sys.which("python"), required = TRUE); invisible(lapply(list.files("r/beam/vignettes", pattern = "[.]Rmd$", full.names = TRUE), function(f) rmarkdown::render(f, output_dir = "rendered-vignettes", quiet = TRUE)))'

      - name: Upload rendered vignettes
        if: always() && matrix.config.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rbeam-vignettes
          path: rendered-vignettes/*.html
          if-no-files-found: error
