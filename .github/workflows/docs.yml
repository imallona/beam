name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - '_quarto.yml'
      - 'index.qmd'
      - 'src/beam/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install beam and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          # quartodoc and griffe pinned to a compatible pair: quartodoc 0.7.x
          # still passes allow_section_blank_line to griffe.parse_numpy, which
          # griffe 1.x rejects. Pinning griffe<0.49 keeps the kwarg accepted.
          pip install "quartodoc==0.7.6" "griffe>=0.40,<0.49"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Generate Python API reference with quartodoc
        run: |
          python -m quartodoc build
        continue-on-error: true

      - name: Render the site
        run: |
          quarto render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
