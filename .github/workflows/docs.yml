name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'examples/**'
      - '_quarto.yml'
      - 'index.qmd'
      - 'src/beam/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install beam and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
          # quartodoc and griffe pinned to a compatible pair: quartodoc 0.7.x
          # still passes allow_section_blank_line to griffe.parse_numpy, which
          # griffe 1.x rejects. Pinning griffe<0.49 keeps the kwarg accepted.
          pip install "quartodoc==0.7.6" "griffe>=0.40,<0.49"

      # R is set up before the render: the Python examples shell out to Rscript
      # for the heterogeneity chunks, which fall back to "install ..." if it is
      # absent. continue-on-error keeps a flaky install from blocking the deploy.
      - uses: r-lib/actions/setup-r@v2
        continue-on-error: true
        with:
          use-public-rspm: true

      - name: Point reticulate at the workflow Python
        run: echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        with:
          working-directory: r/beam
          extra-packages: |
            any::roxygen2
            any::knitr
            any::rmarkdown
            any::reticulate
            any::lme4
            any::glmmTMB
            any::psychotree
            any::psychotools
            any::partykit
            any::PlackettLuce
            any::qvcalc
            any::meta
            any::netmeta

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Generate Python API reference with quartodoc
        run: |
          python -m quartodoc build
        continue-on-error: true

      - name: Render the site
        run: |
          quarto render

      # Render the R package vignettes into the site for the how-to to link to.
      - name: Render the R vignettes into the site
        continue-on-error: true
        run: |
          Rscript -e 'roxygen2::roxygenise("r/beam")'
          R CMD INSTALL --no-multiarch r/beam
          mkdir -p _site/r-vignettes
          Rscript -e 'reticulate::use_python(Sys.which("python"), required = TRUE); invisible(lapply(list.files("r/beam/vignettes", pattern = "[.]Rmd$", full.names = TRUE), function(f) rmarkdown::render(f, output_dir = "_site/r-vignettes", quiet = TRUE)))'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
