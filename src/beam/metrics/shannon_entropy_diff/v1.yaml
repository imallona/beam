id: shannon_entropy_diff
version: v1
name: Shannon entropy difference of cluster sizes
aliases:
  - s.norm.vs.true
  - normalized_entropy_difference
description: "Absolute difference in the normalized Shannon entropy of the cluster-size distribution between an estimated and the true partition, as used in the Duo 2018 benchmark (the s.norm.vs.true column). The normalized entropy measures how evenly elements are spread across clusters, scaled to [0, 1] by the log of the cluster count, so a perfectly balanced partition reaches 1 and a fully concentrated one reaches 0. A value of 0 means the estimated clustering matches the truth in how evenly it spreads elements; larger values mean it departs further."
citations:
  - text: "Duo A, Robinson MD, Soneson C. A systematic performance evaluation of clustering methods for single-cell RNA-seq data. F1000Research 2018, 7:1141."
    doi: "10.12688/f1000research.15666.3"
metric_kind: derived
measurand: discrepancy in normalized cluster-size entropy between an estimated and a true partition
task:
  - clustering
requires_ground_truth: true
ground_truth:
  description: a reference partition of the same elements, whose normalized Shannon entropy sets the comparison point
  shape: vector
  dtype: nominal_label
inputs:
  - role: predicted_partition
    shape: vector
    dtype: nominal_label
    description: cluster assignment per element from the method under evaluation
  - role: true_partition
    shape: vector
    dtype: nominal_label
    description: reference partition; same length as predicted_partition
output:
  shape: scalar
  dtype: float
  description: absolute difference of normalized Shannon entropies, in [0, 1]
semantics:
  scale_type: ratio
  scale_rationale: "The quantity is the absolute difference of two normalized entropies, each in [0, 1]. A value of 0 means no discrepancy, a genuine zero, and twice the difference is twice as far from matching the truth, so the scale is ratio. The Duo 2018 values fall well inside the unit interval (about 0 to 0.74); the upper bound of 1 is the theoretical maximum."
  range:
    lower: 0
    upper: 1
    lower_inclusive: true
    upper_inclusive: true
  polarity: lower_is_better
  monotonic: true
  meaningful_zero: true
  allowed_transformations:
    - affine
    - rank
  uncertainty_model:
    type: none
comparability:
  comparable_within:
    - same_dataset
  aggregation_rules:
    - bounded_ratio_metric_takes_arithmetic_mean_across_datasets
    - rescale_within_declared_bounds_before_cross_dataset_aggregation
  recommended_aggregation_across_datasets: arithmetic_mean
  recommended_normalization: min_max
implementations:
  - name: duoclustering2018
    language: r
    package: DuoClustering2018
    function: plot_entropy
    license: GPL-2.0-or-later
    repo_url: https://bioconductor.org/packages/DuoClustering2018
    citation: "Duo A, Robinson MD, Soneson C. F1000Research 2018, 7:1141."
examples:
  - description: estimated partition reproduces the true normalized entropy exactly
    inputs:
      predicted_entropy_normalized: 0.8
      true_entropy_normalized: 0.8
    expected_output: 0.0
    tolerance: 1.0e-12
  - description: estimated partition is more balanced than the truth
    inputs:
      predicted_entropy_normalized: 0.9
      true_entropy_normalized: 0.6
    expected_output: 0.3
    tolerance: 1.0e-12
# No STATO term for the normalized Shannon entropy difference of cluster sizes
# as of 2026-05-28; STATO has no Shannon entropy class. Documented as a
# proposed-upstream gap.
provenance:
  author: Izaskun Mallona
  contact: izaskun.mallona@gmail.com
  created: "2026-05-24"
