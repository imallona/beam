id: calibration_slope
version: v1
name: Calibration slope
aliases:
  - cal_slope
  - recalibration_slope
description: "Slope of a logistic recalibration model that regresses the observed binary outcome on a risk model's linear predictor (the log-odds). A slope of 1 means the predicted risks are correctly scaled. Below 1 the predictions are too extreme, the usual sign of overfitting; above 1 they are too moderate. The ideal is exactly 1, so this is a target_value metric, where neither the highest nor the lowest value is best."
citations:
  - text: "Van Calster B, McLernon DJ, van Smeden M, Wynants L, Steyerberg EW. Calibration: the Achilles heel of predictive analytics. BMC Medicine 2019, 17:230."
    doi: "10.1186/s12916-019-1466-7"
metric_kind: derived
measurand: slope of the observed outcome regressed on the model's linear predictor
task:
  - classification
requires_ground_truth: true
ground_truth:
  description: the observed binary outcome for each instance
  shape: vector
  dtype: bool
inputs:
  - role: predicted_probability
    shape: vector
    dtype: float
    description: predicted risk per instance from the model under evaluation, in [0, 1]
  - role: observed_outcome
    shape: vector
    dtype: bool
    description: observed binary outcome; same length as predicted_probability
output:
  shape: scalar
  dtype: float
  description: the recalibration slope, a real number whose ideal value is 1
semantics:
  scale_type: interval
  scale_rationale: "The slope is a logistic-regression coefficient, so differences are meaningful but there is no ratio origin. A slope of zero means no association, not an absent quantity, and negative slopes are possible. That makes it interval, which admits the affine transformations the target_relative normalization uses."
  range:
    lower: null
    upper: null
  polarity: target_value
  target: 1.0
  monotonic: false
  meaningful_zero: false
  allowed_transformations:
    - affine
  uncertainty_model:
    type: analytic
comparability:
  comparable_within:
    - same_dataset
    - same_task
  aggregation_rules:
    - deviation_from_target_is_arithmetic_across_datasets
  recommended_aggregation_across_datasets: arithmetic_mean
  recommended_normalization: target_relative
implementations:
  - name: rms
    language: r
    package: rms
    function: val.prob
    license: GPL-2.0-or-later
    repo_url: https://cran.r-project.org/package=rms
    citation: "Harrell FE. Regression Modeling Strategies. Springer, 2015."
examples:
  - description: a correctly calibrated model has slope one
    inputs:
      note: predicted risks already on the right scale, so the recalibration slope is one
    expected_output: 1.0
    tolerance: 0.05
  - description: an overfit model whose predictions are too extreme has slope below one
    inputs:
      note: predictions more extreme than warranted, shrunk by the recalibration
    expected_output: 0.7
    tolerance: 0.1
mappings:
  stato: http://purl.obolibrary.org/obo/STATO_0000687
provenance:
  author: Izaskun Mallona
  contact: izaskun.mallona@gmail.com
  created: "2026-05-27"
