id: pcr
version: v1
name: Principal component regression comparison
description: Batch-removal score from the scIB single-cell integration benchmark. It measures the change in batch-associated variance (principal component regression) before and after integration, rescaled to [0, 1] where higher is better.
citations:
- text: Buttner M, Miao Z, Wolf FA, Teichmann SA, Theis FJ. A test metric for assessing
    single-cell RNA-seq batch correction. Nature Methods, 2019.
  doi: 10.1038/s41592-018-0254-1
- text: Luecken MD, et al. Benchmarking atlas-level data integration in single-cell
    genomics. Nature Methods, 2022. Aggregates this metric in the integration benchmark.
  doi: 10.1038/s41592-021-01336-8
metric_kind: derived
measurand: change in the variance attributable to batch, regressed on principal components,
  before versus after integration
task:
- integration
requires_ground_truth: false
inputs:
- role: integrated_embedding
  shape: matrix
  dtype: float
  description: the integrated cell-by-dimension embedding (or knn graph) produced
    by the method under evaluation
output:
  shape: scalar
  dtype: float
  description: scIB-scaled score in [0, 1], higher is better
semantics:
  scale_type: interval
  scale_rationale: scIB rescales the metric to [0, 1] for cross-method comparison. The unit length varies across benchmarks, so the scale is interval, not ratio.
  range:
    lower: 0
    upper: 1
    lower_inclusive: true
    upper_inclusive: true
  polarity: higher_is_better
  monotonic: true
  meaningful_zero: false
  allowed_transformations:
  - affine
  - rank
  uncertainty_model:
    type: none
comparability:
  comparable_within:
  - same_dataset
  aggregation_rules:
  - arithmetic_mean_across_datasets
  recommended_aggregation_across_datasets: arithmetic_mean
  recommended_normalization: min_max
implementations:
- name: scib
  language: python
  package: scib
  function: scib.metrics.pcr_comparison
  license: MIT
  repo_url: https://github.com/theislab/scib
examples:
- description: perfect score (scIB scaled upper bound)
  expected_output: 1.0
- description: worst score (scIB scaled lower bound)
  expected_output: 0.0
mappings:
  obi: http://purl.obolibrary.org/obo/OBI_0200104
# OBI_0200104 (principal component regression) is the precise statistical
# method. OBI_0002631 (single-cell RNA sequencing assay) is the broader assay
# context but only OBI_0200104 is recorded here to avoid duplicating the same
# assay key across the scIB family; the assay context is implicit in the task
# field and the docs/explanations/ontology-mappings.md cross-reference.
provenance:
  author: Izaskun Mallona
  contact: izaskun.mallona@gmail.com
  created: '2026-05-26'
  modified: '2026-05-26'
  license: CC-BY-4.0
