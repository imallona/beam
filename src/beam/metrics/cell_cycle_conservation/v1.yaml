id: cell_cycle_conservation
version: v1
name: Cell-cycle conservation
description: Single-cell data-integration metric from the scIB benchmark, a biological-conservation
  score. Measures conservation of the cell-cycle signal, from the variance explained
  by S and G2M cell-cycle scores before versus after integration. scIB rescales it
  to the unit interval where higher is better.
citations:
- text: Tirosh I, et al. Dissecting the multicellular ecosystem of metastatic melanoma
    by single-cell RNA-seq. Science, 2016.
  doi: 10.1126/science.aad0501
- text: Luecken MD, et al. Benchmarking atlas-level data integration in single-cell
    genomics. Nature Methods, 2022. Aggregates this metric in the integration benchmark.
  doi: 10.1038/s41592-021-01336-8
metric_kind: derived
measurand: conservation of the cell-cycle signal, from the variance explained by S
  and G2M cell-cycle scores before versus after integration
task:
- integration
requires_ground_truth: false
inputs:
- role: integrated_embedding
  shape: matrix
  dtype: float
  description: the integrated cell-by-dimension embedding (or knn graph) produced
    by the method under evaluation
output:
  shape: scalar
  dtype: float
  description: scIB-scaled score in [0, 1], higher is better
semantics:
  scale_type: interval
  scale_rationale: scIB rescales the metric to a bounded [0, 1] range for cross-method
    aggregation; the unit length is not invariant across benchmarks, so the scale
    is interval rather than ratio.
  range:
    lower: 0
    upper: 1
    lower_inclusive: true
    upper_inclusive: true
  polarity: higher_is_better
  monotonic: true
  meaningful_zero: false
  allowed_transformations:
  - affine
  - rank
  uncertainty_model:
    type: none
comparability:
  comparable_within:
  - same_dataset
  aggregation_rules:
  - arithmetic_mean_across_datasets
  recommended_aggregation_across_datasets: arithmetic_mean
  recommended_normalization: min_max
implementations:
- name: scib
  language: python
  package: scib
  function: scib.metrics.cell_cycle
  license: MIT
  repo_url: https://github.com/theislab/scib
examples:
- description: perfect score (scIB scaled upper bound)
  expected_output: 1.0
- description: worst score (scIB scaled lower bound)
  expected_output: 0.0
mappings:
  obi: http://purl.obolibrary.org/obo/OBI_0002631
# OBI_0002631 (single-cell RNA sequencing assay) gives the assay context. GO
# carries cell cycle (GO_0007049) but the variance-explained-by-cell-cycle
# scIB score has no STATO term as of 2026-05-28; documented as a proposed-
# upstream gap.
provenance:
  author: Izaskun Mallona
  contact: izaskun.mallona@gmail.com
  created: '2026-05-26'
  modified: '2026-05-26'
  license: CC-BY-4.0
