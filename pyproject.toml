[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beam"
version = "0.1.3"
description = "Benchmark Evaluation And Metrics: metric formalization, MCDA, and heterogeneity diagnostics for bioinformatics benchmarks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Izaskun Mallona", email = "izaskun.mallona@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "jsonschema>=4.18",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
io = [
    "pandas>=2.0",
]
docs = [
    "jupyter>=1.0",
]

[project.urls]
Homepage = "https://github.com/imallona/beam"
Repository = "https://github.com/imallona/beam"

[tool.hatch.build.targets.wheel]
packages = ["src/beam"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "schema/",
    "metrics/",
    "tests/",
    "README.md",
    "PLAN.md",
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "multicriteria_decision_making_report.ipynb",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
